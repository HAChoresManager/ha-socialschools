[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".git", "scripts"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "ASYNC"]
"scripts/*" = ["S"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.socialschools"]
combine-as-imports = true
